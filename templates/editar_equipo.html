{% extends "base.html" %}

{% block title %}Editar Equipo{% endblock %}

{% block content %}
<h1>Editar Equipo</h1>
<form method="POST">
    <label>Cliente:</label>
    <select name="id_cliente" required>
        {% for cliente in clientes %}
            <option value="{{ cliente['id_cliente'] }}" 
                {% if cliente['id_cliente'] == equipo['id_cliente'] %}selected{% endif %}>
                {{ cliente['nombres'] }} {{ cliente['apellidos'] }}
            </option>
        {% endfor %}
    </select>

    <input type="text" name="marca" value="{{ equipo['marca'] }}" required>
    <input type="text" name="modelo" value="{{ equipo['modelo'] }}" required>
    <input type="text" name="serie" value="{{ equipo['serie'] }}">
    <textarea name="observaciones">{{ equipo['observaciones'] }}</textarea>
    <input type="text" name="accesorios" value="{{ equipo['accesorios'] }}">
    <button type="submit">Guardar cambios</button>
</form>

<a href="/equipos">Volver a equipos</a>
{% endblock %}
